ch Yuumis Schnurrschutz).",synergy:"Verstärkt Laternenwall, Schildspange, Sanftes Leinen und Yuumi."},glocke:{id:"glocke",name:"Gesprungene Glocke",rarity:"rare",short:"Erster Schildbruch im Kampf: +2 Fokus",tags:["bastion","echo"],description:"Der erste gebrochene Schild eines Verbündeten pro Kampf erzeugt 2 Fokus.",synergy:"Verbindet Bastion und Echo."},taschenuhr:{id:"taschenuhr",name:"Taschenuhr ohne Zeiger",rarity:"magic",short:"Erste Fähigkeit im Kampf −2 Fokus",tags:["echo"],description:"Die erste aktive Fähigkeit des Kampfes kostet 2 Fokus weniger (mindestens 0).",synergy:"Sofortiger Funkensturm oder Laternenwall zum Kampfbeginn."},chor:{id:"chor",name:"Chor der Namen",rarity:"rare",short:"Jede 3. Fähigkeit heilt alle um 8",tags:["echo","bastion"],description:"Jeder 3. manuelle Fähigkeitseinsatz der Gruppe heilt alle lebenden Helden um 8.",synergy:"Viele günstige Fähigkeiten (Laternenwall, Klarer Gedanke) füllen den Chor schnell."},mondgloeckchen:{id:"mondgloeckchen",name:"Yuumis Mondglöckchen",rarity:"rare",short:"Yuumi kämpft mit: Pfotenhieb & Schnurrschutz",tags:["glut","bastion","echo"],description:"Ruft Yuumi als automatisch kämpfende Begleiterin: Pfotenhieb (4 Schaden alle 3 s auf das Fokusziel); jeder 3. Pfotenhieb gibt der verletztesten Hauptfigur 5 Schild (Schnurrschutz). Einzigartig.",flavor:"„Ein silbernes Glöckchen, das auch im dichtesten Nebel leise klingt. Wenn es läutet, ist Yuumi nie weit entfernt.“",synergy:"Schnurrschutz wird von Wappen der Wache und Standhaft verstärkt. Belegt einen Reliktplatz, gilt nur für diesen Run."}},ff={common:"Gewöhnlich",magic:"Magisch",rare:"Selten",legendary:"Legendär"},Nf={common:"●",magic:"◆",rare:"✦",legendary:"★"},ar={glut:"Glut",bastion:"Bastion",echo:"Echo"},Ll={glut:"🔥",bastion:"🛡️",echo:"🔁"},it={breiterWallBonus:8,standhaftMult:.4,schildstossDamage:12,schildstossVulnerable:3,lauffeuerStacks:1,heisseAscheMult:.5,nachzuendungDelay:1.5,nachzuendungPower:.5,nachhallPerSecond:3,nachhallDuration:3,behutsameBonus:4,klarerGedankeDiscount:1},In={breiterWall:{id:"breiterWall",hero:"fritz",name:"Breiter Wall",tags:["bastion"],description:"Laternenwall gibt +8 Schild je Held."},standhaft:{id:"standhaft",hero:"fritz",name:"Standhaft",tags:["bastion"],description:"Alle Schilde, die Fritz erhält, sind 40 % stärker (auch Yuumis Schnurrschutz)."},schildstoss:{id:"schildstoss",hero:"fritz",name:"Schildstoß",tags:["bastion","glut"],description:"Laternenwall trifft zusätzlich das Fokusziel: 12 Schaden und 3 s Verwundbar."},lauffeuer:{id:"lauffeuer",hero:"ivo",name:"Lauffeuer",tags:["glut"],description:"Stirbt ein brennender Gegner, erhalten alle anderen Gegner 1 Brandstapel."},heisseAsche:{id:"heisseAsche",hero:"ivo",name:"Heiße Asche",tags:["glut"],description:"Von Ivo verursachter Brand ist 50 % stärker."},nachzuendung:{id:"nachzuendung",hero:"ivo",name:"Nachzündung",tags:["glut","echo"],description:"Funkensturm trifft 1,5 s später erneut mit 50 % Wirkung (zählt nicht als manueller Einsatz)."},nachhall:{id:"nachhall",hero:"sera",name:"Nachhall",tags:["bastion","echo"],description:"Erinnerung bewahren heilt die Ziele 3 s lang um 3 HP pro Sekunde weiter."},behutsameHaende:{id:"behutsameHaende",hero:"sera",name:"Behutsame Hände",tags:["bastion"],description:"Seras automatische Heilung heilt +4."},klarerGedanke:{id:"klarerGedanke",hero:"sera",name:"Klarer Gedanke",tags:["echo"],description:"Erinnerung bewahren kostet 1 Fokus weniger (mindestens 1)."}},Al={glut2Stacks:2,glut3Heal:12,bastion2Shield:8,bastion3Focus:1,echo2CdMult:.6,echo3Every:3,echo3Reduce:1.5},Me={glut1:{id:"glut1",branch:"glut",tier:1,name:"Siegel der Zunder",cost:2,load:1,startItem:"zunderring",description:"Du startest mit einem Zunderring (Träger wählbar)."},glut2:{id:"glut2",branch:"glut",tier:2,name:"Siegel des ersten Funkens",cost:4,load:1,description:"Der erste Funkensturm jedes Kampfes fügt +2 Brandstapel zu."},glut3:{id:"glut3",branch:"glut",tier:3,name:"Siegel der warmen Asche",cost:6,load:2,description:"Der erste besiegte brennende Gegner jedes Kampfes heilt alle Helden um 12."},bastion1:{id:"bastion1",branch:"bastion",tier:1,name:"Siegel der Spange",cost:2,load:1,startItem:"schildspange",description:"Du startest mit einer Schildspange (Träger wählbar)."},bastion2:{id:"bastion2",branch:"bastion",tier:2,name:"Siegel der Wachsamkeit",cost:4,load:1,description:"Alle Helden beginnen jeden Kampf mit 8 Schild."},bastion3:{id:"bastion3",branch:"bastion",tier:3,name:"Siegel des Widerhalls",cost:6,load:2,description:"Der erste gebrochene Schild jeder Hauptfigur pro Kampf erzeugt 1 Fokus."},echo1:{id:"echo1",branch:"echo",tier:1,name:"Siegel der Stimmgabel",cost:2,load:1,startItem:"stimmgabel",description:"Du startest mit einer Stimmgabel (Träger wählbar)."},echo2:{id:"echo2",branch:"echo",tier:2,name:"Siegel des schnellen Atems",cost:4,load:1,description:"Die erste aktive Fähigkeit jeder Hauptfigur pro Kampf hat 40 % kürzere Abklingzeit."},echo3:{id:"echo3",branch:"echo",tier:3,name:"Siegel des Kanons",cost:6,load:2,description:"Jeder 3. manuelle Fähigkeitseinsatz der Gruppe verkürzt alle laufenden Abklingzeiten um 1,5 s."}},hs=["glut1","glut2","glut3","bastion1","bastion2","bastion3","echo1","echo2","echo3"],or={fritz:"Fritz",ivo:"Ivo",sera:"Sera",yuumi:"Yuumi",narrator:"",mira:"Mira, die Botin",waechter:"Der Glockenwächter",archivarin:"Die Archivarin",hueter:"Der Hüter"},kt=(r,s,c)=>({id:r,title:s,lines:c}),ir={intro:kt("intro","Die Stadt Vesper",[{speaker:"narrator",text:"Jede Nacht steigt der Nebel über Vesper. Wen er berührt, der vergisst – erst Wege, dann Namen, dann sich selbst."},{speaker:"narrator",text:"Nur ein kleiner Raum bleibt hell: die Laternenstube. Drei Reisende wachen dort auf, mit Asche an den Stiefeln und Lücken im Gedächtnis."},{speaker:"fritz",text:"Wir sind wieder hier. Das heißt, wir haben verloren. Und das heißt, wir gehen noch mal raus.",mood:"serious"},{speaker:"ivo",text:"Faszinierend, nicht wahr? Die Laterne zieht uns zurück, jedes Mal. Ich habe eine Theorie. Genau genommen drei."},{speaker:"sera",text:"Erst mal atmen, ihr beiden. Fritz, dein Ärmel ist wieder aufgerissen … komm her.",mood:"smile"},{speaker:"sera",text:"In der Vorstadt läutet eine Glocke, jede Nacht, genau wenn der Nebel kommt. Ich glaube, dort fängt alles an."},{speaker:"fritz",text:"Dann holen wir uns diese Glocke. Ich gehe vorn. Wie immer."}]),exp1_start:kt("exp1_start","Die versunkene Vorstadt",[{speaker:"ivo",text:"Kurze Einweisung, weil ich sie sowieso geben würde: Wir greifen von allein an. Unsere Fähigkeiten kosten Fokus – den teilen wir uns."},{speaker:"fritz",text:"Klick auf einen Gegner, dann schlagen wir alle auf ihn. Wenn einer ausholt, halte ich ihn mit dem Laternenwall auf."},{speaker:"sera",text:"Und wenn es wehtut, bin ich da. Versprochen.",mood:"smile"}]),cat_join:kt("cat_join","Yuumi",[{speaker:"sera",text:"Oh … hallo, du Kleine. Du zitterst ja. Keiner tut dir hier etwas, ja? Ganz ruhig.",mood:"happy"},{speaker:"yuumi",text:"*mrrp?* – ein winziges Glöckchen klingt, hell wie Mondlicht."},{speaker:"fritz",text:"… Hier. Das Brett ist weg. Das Glöckchen hing fest.",mood:"smile"},{speaker:"ivo",text:"Bemerkenswert. Das Glöckchen schwingt, aber der Nebel dämpft seinen Klang nicht. Vermutlich eine Resonanz mit dem Laternenlicht, oder – nun ja. Magie."},{speaker:"sera",text:"Sie heißt Yuumi. Steht doch am Glöckchen. Willst du ein Stück mit uns kommen, Yuumi?",mood:"happy"},{speaker:"yuumi",text:"*schnurrt und streicht Fritz um die Stiefel*"},{speaker:"fritz",text:"Sie bleibt neben mir. Da ist sie sicher."},{speaker:"narrator",text:"Yuumis Mondglöckchen belegt einen Reliktplatz. Yuumi kämpft selbstständig mit, bis der Run endet – danach muss das Glöckchen neu gefunden werden."}]),cat_rest:kt("cat_rest","Eine kurze Rast",[{speaker:"sera",text:"Wir können dich nicht mitnehmen, Kleine. Aber du hast uns eine Pause geschenkt. Danke.",mood:"smile"},{speaker:"yuumi",text:"*blinzelt langsam und verschwindet unversehrt zwischen den Marktständen*"},{speaker:"fritz",text:"Sie findet ihren Weg. Katzen tun das."}]),boss1_pre:kt("boss1_pre","Der Glockenturm",[{speaker:"waechter",text:"KEHRT UM. Die Glocke hält, was hinter ihr liegt."},{speaker:"fritz",text:"Du hältst eine ganze Stadt im Nebel. Genug gehalten."},{speaker:"ivo",text:"Er holt weit aus, bevor er zuschlägt. Fritz – den Schlag unterbrechen!"}]),boss1_after:kt("boss1_after","Die gesprungene Glocke",[{speaker:"waechter",text:"Ihr … Narren. Ich habe nicht den Nebel gehalten. Ich habe den Hunger zurückgehalten. Den Hunger hinter dem Licht."},{speaker:"narrator",text:"Die Glocke springt. Der Nebel weicht nicht – er zieht sich zusammen, einem Ort entgegen: dem Archiv der Namen."},{speaker:"ivo",text:"Hunger hinter dem Licht? Das ist … keine gute Metapher. Oder eine sehr gute. Ich weiß nicht, was mir mehr Angst macht."},{speaker:"sera",text:"…",mood:"sad"},{speaker:"fritz",text:"Sera? Du bist blass."},{speaker:"sera",text:"Es ist nichts. Lasst uns zurück zur Laterne gehen. Bitte.",mood:"sad"},{speaker:"yuumi",text:"*schmiegt sich an Seras Hand, bis sie wieder lächelt*",if:"yuumi"}]),exp2_start:kt("exp2_start","Das Archiv der Namen",[{speaker:"ivo",text:"Jede Regalreihe hier ist ein Viertel von Vesper. Jede Karte ein Mensch. Und so viele sind leer."},{speaker:"fritz",text:"Die Gegner hier heilen einander und löschen Brände. Erst die Heilerin, dann der Rest."},{speaker:"sera",text:"Ich kenne diese Gänge. Ich … erzähle es euch. Wenn wir tiefer drin sind.",mood:"sad"}]),boss2_pre:kt("boss2_pre","Die Archivarin",[{speaker:"archivarin",text:"Du bist zurück, Lehrling. Mit Fremden. Sie wissen noch nicht, wofür ihr Licht bezahlt wird."},{speaker:"sera",text:"Sie wissen es. Ich habe es ihnen gesagt. Und jetzt beenden wir das Tilgen.",mood:"serious"},{speaker:"mira",text:"Ich kenne ihren Namen. Ich habe ihn all die Jahre getragen. Wenn ich ihn rufe, wird sie schwanken!",if:"courier"}]),boss2_after:kt("boss2_after","Ein Name kehrt zurück",[{speaker:"archivarin",text:"Ich gab der Laterne meinen Namen, damit sie brennt. Dann die Namen der anderen. Es war nie genug."},{speaker:"sera",text:"Wir wollten niemanden vergessen lassen. Und haben am Ende die ganze Stadt vergessen lassen.",mood:"sad"},{speaker:"fritz",text:"Du hast es gut gemeint. Das macht es nicht ungeschehen. Aber du trägst es nicht allein.",mood:"serious"},{speaker:"mira",text:"Ihr Name war Hedda. Jetzt erinnert sich wieder jemand an sie.",if:"courier"},{speaker:"ivo",text:"Das Herz der Laterne liegt unter der Stube. Unter uns. Die ganze Zeit."}]),exp3_start:kt("exp3_start","Das Herz der Laterne",[{speaker:"narrator",text:"Unter der Laternenstube führt eine Treppe hinab, die gestern noch nicht da war."},{speaker:"ivo",text:"Alles, was wir gesehen haben, kommt hier zusammen. Schilde, Brand, Heiler, schwere Schläge. Bitte keine Überraschungen mehr."},{speaker:"fritz",text:"Egal, was da unten wartet. Wir gehen zusammen."},{speaker:"sera",text:"Zusammen. Und diesmal bleibe ich nicht still.",mood:"smile"}]),boss3_pre:kt("boss3_pre","Der Hüter des letzten Lichts",[{speaker:"hueter",text:"Ich bin, was ihr jede Nacht zurückgebracht habt. Jede Niederlage hat mich genährt."},{speaker:"ivo",text:"Er ermüdet zwischen seinen Angriffen – dann ist er verwundbar. Und das „Letzte Licht“ kann niemand unterbrechen!"},{speaker:"fritz",text:"Dann stehen wir es durch. Sera, bleib hinter mir."}]),boss3_after:kt("boss3_after","Die Entscheidung",[{speaker:"narrator",text:"Der Hüter sinkt in sich zusammen. Übrig bleibt eine kleine, zitternde Flamme – die Laterne selbst."},{speaker:"sera",text:"Sie hat uns gerettet. Immer wieder. Und dafür hat sie Vesper leer gebrannt.",mood:"sad"},{speaker:"ivo",text:"Wir könnten sie umbauen. Sie nur noch nehmen lassen, was wir freiwillig geben. Keine Garantie, dass es hält."},{speaker:"fritz",text:"Oder wir löschen sie. Dann kommt der Morgen – und keiner von uns weiß, ob wir ihn sehen."}]),ending_keep:kt("ending_keep","Ende: Das bewahrte Licht",[{speaker:"narrator",text:"Die Laterne brennt weiter, kleiner als zuvor. Sie nimmt keine Namen mehr – nur noch, was freiwillig in ihr Licht gelegt wird."},{speaker:"ivo",text:"Jeden Abend eine Erinnerung. Eine kleine. Ich habe gestern meinen ersten Lehrer hineingelegt. Er hätte es verstanden."},{speaker:"fritz",text:"Ich habe das Tor hineingelegt. Die Nacht, in der ich es schließen ließ. Es wiegt jetzt weniger.",mood:"serious"},{speaker:"sera",text:"Und die Stadt erinnert sich wieder. Langsam. Name für Name. Wir passen auf sie auf – und aufeinander.",mood:"happy"},{speaker:"yuumi",text:"*Yuumi rollt sich im warmen Schein zusammen. Ihr Glöckchen klingt leise, wenn Sera ihr über den Kopf streicht.*",if:"endingYuumi"},{speaker:"narrator",text:"Die Geschichte ist erzählt. Weitere Expeditionen sind Erinnerungen an diese Nächte – und „Die lange Nacht“ wartet auf Mutige."}]),ending_extinguish:kt("ending_extinguish","Ende: Eine Nacht, die enden darf",[{speaker:"narrator",text:"Sera legt die Hand auf die Flamme. Sie erlischt ohne einen Laut."},{speaker:"narrator",text:"Über Vesper wird der Himmel grau, dann blass, dann golden. Der Nebel zieht sich zurück – und mit ihm die Gewissheit, zurückzukehren."},{speaker:"ivo",text:"Keine Wiederkehr mehr. Wenn wir jetzt fallen, fallen wir. Merkwürdig, wie sehr ich mich darauf freue, vorsichtig zu sein."},{speaker:"fritz",text:"Die Tore sind offen. Diesmal bleiben sie das.",mood:"smile"},{speaker:"sera",text:"Ich weiß nicht, was morgen kommt. Aber es ist unser Morgen. Und wir erinnern uns daran.",mood:"happy"},{speaker:"yuumi",text:"*Yuumi sitzt auf dem Fenstersims und blinzelt in den ersten Sonnenaufgang seit Jahren. Das Glöckchen klingt – ganz ohne Nebel.*",if:"endingYuumi"},{speaker:"narrator",text:"Die Geschichte ist erzählt. Weitere Expeditionen sind Erinnerungen an diese Nächte – und „Die lange Nacht“ wartet auf Mutige."}]),first_defeat:kt("first_defeat","Zurück im Licht",[{speaker:"sera",text:"Schhh, ihr seid wieder da. Alle drei. Das ist das Wichtigste.",mood:"smile"},{speaker:"fritz",text:"Wir sind zu schnell gefallen. Nächstes Mal halte ich die schweren Schläge auf."},{speaker:"ivo",text:"Das Erinnerungslicht, das wir mitgebracht haben, bleibt. Damit können wir Siegel prägen. Fortschritt! Irgendwie."}]),memory_run:kt("memory_run","Eine Erinnerung",[{speaker:"narrator",text:"Die Geschichte ist erzählt. Diese Expedition ist eine Erinnerung an jene Nächte – Entscheidungen darin verändern das Ende nicht mehr."}])},df={miauen:{id:"miauen",title:"Ein Miauen im Nebel",icon:"🐈",mapHint:"Aus dem Nebel dringt ein leises Miauen …",story:!1,intro:[{speaker:"narrator",text:"Unter einem umgestürzten Marktstand bewegt sich etwas Graues. Zwei große Augen, ein leises, klägliches Miauen."},{speaker:"sera",text:"Wartet. Ganz langsam … Hallo, du. Hast du dich verhakt?",mood:"smile"},{speaker:"fritz",text:"Ein Brett drückt auf ihr Halsband. Ich hebe es an. Sera, halt sie fest."}],choices:[{label:"Das Laternenlicht mit Yuumi teilen",preview:"Erhalte Yuumis Mondglöckchen (Relikt, belegt 1 von 2 Reliktplätzen): Yuumi kämpft bis zum Ende des Runs mit.",risk:"Gegenleistung: Der nächste Kampf beginnt mit 1 Fokus weniger."},{label:"Die kurze Rast nutzen",preview:"Alle drei Hauptfiguren heilen 12 % ihrer max. HP. Das Relikt wird nicht erworben; Yuumi zieht unversehrt weiter."}]},brunnen:{id:"brunnen",title:"Der Brunnen der leisen Wünsche",icon:"⛲",mapHint:"Ein alter Brunnen, der im Nebel schimmert.",story:!1,intro:[{speaker:"narrator",text:"Auf dem Grund eines Brunnens glitzert etwas. Das Wasser flüstert Namen."},{speaker:"ivo",text:"Das Glitzern könnte ein Relikt sein. Oder Kälte, die sehr, sehr weh tut."}],choices:[{label:"Einen Wunsch flüstern",preview:"Alle Helden heilen 25 % ihrer max. HP."},{label:"Nach dem Glitzern tauchen",preview:"Wähle 1 von 2 Relikten (oder lehne ab).",risk:"Risiko: Alle Helden verlieren 10 % ihrer max. HP (nie tödlich)."}]},werkstatt:{id:"werkstatt",title:"Ivos alte Funkenwerkstatt",icon:"⚗️",mapHint:"Ein verlassener Laborraum. Ivo wird ganz aufgeregt.",story:!1,intro:[{speaker:"ivo",text:"Das … ist meine Werkstatt! Also, war. Bevor sie mich verbannt haben. Wegen einer Kleinigkeit. Ein Dach. Zwei Dächer."},{speaker:"sera",text:"Du strahlst ja, Ivo. Nimm dir, was du brauchst.",mood:"smile"}],choices:[{label:"Ivo experimentieren lassen",preview:"+12 Erfahrung für die Gruppe (Run-Level schneller)."},{label:"Material einsammeln",preview:"Wähle 1 von 3 Gegenständen (bevorzugt Glut)."}]},wachstube:{id:"wachstube",title:"Die Wachstube am Tor",icon:"🏰",mapHint:"Ein Wachhaus. Fritz bleibt davor stehen.",story:!1,intro:[{speaker:"fritz",text:"Hier habe ich Dienst geschoben. In der Nacht, als der Nebel kam, habe ich befohlen, das Tor zu schließen.",mood:"serious"},{speaker:"sera",text:"Um die drinnen zu retten. Fritz … du hast getan, was du konntest.",mood:"sad"},{speaker:"fritz",text:"Und die draußen? Egal. In der Truhe liegt noch Ausrüstung der Wache."}],choices:[{label:"Die Wappentruhe öffnen",preview:"Wähle 1 von 2 Relikten; das Wappen der Wache ist dabei, falls es nicht schon ausgerüstet ist."},{label:"Kurz innehalten",preview:"Alle Helden heilen 15 % ihrer max. HP; der nächste Kampf beginnt mit +1 Fokus."}]},kinderlied:{id:"kinderlied",title:"Das Kinderlied",icon:"🎶",mapHint:"Irgendwo singt jemand ein Lied, das Sera kennt.",story:!1,intro:[{speaker:"narrator",text:"Eine Kinderstimme singt im Nebel, immer dieselbe Strophe. Sera summt leise mit."},{speaker:"sera",text:"Das haben wir früher im Archiv gesungen, damit die Namen nicht einschlafen.",mood:"smile"}],choices:[{label:"Mitsingen",preview:"Alle Helden heilen 20 % ihrer max. HP; der nächste Kampf beginnt mit +1 Fokus."},{label:"Dem Lied folgen",preview:"Wähle 1 von 2 Relikten; Chor der Namen ist dabei, falls nicht schon ausgerüstet."}]},haendler:{id:"haendler",title:"Der Nebelhändler",icon:"🎭",mapHint:"Eine Gestalt mit Laterne ohne Licht bietet Waren an.",story:!1,intro:[{speaker:"narrator",text:"„Seltene Ware, feine
